name: Deploy Sphinx Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'requirements-docs.txt'
      - '.github/workflows/deploy-docs.yml'
      - 'static-site/**' # Track changes to your landing page assets
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements-docs.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build HTML documentation
        run: |
          sphinx-build -b html docs/source docs/build/html

      - name: Assemble Site Layout
        run: |
          mkdir -p dist/docs

          cp -r docs/build/html/* dist/docs/

          cp static-site/index.html dist/index.html
          if [ -d "static-site/images" ]; then
            cp -r static-site/images dist/
          fi

          touch dist/.nojekyll
          touch dist/docs/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4