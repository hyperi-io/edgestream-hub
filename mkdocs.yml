site_name: EdgeStream User & Operator Docs
site_description: User-focused guide plus reference extracted from source
site_url: https://YOUR_NAMESPACE.gitlab.io/YOUR_REPO/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy
    - search.suggest
    - toc.integrate
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
    - media: "(prefers-color-scheme: dark)"
      scheme: slate

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - footnotes
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.tasklist

nav:
  - Home: index.md
  - Using EdgeStream:
      - Overview: user/index.md
  - Reference:
      - API:
          - All Endpoints: reference/api/endpoints.md
      - Web UI:
          - Routes: reference/webui/routes.md
      - Ansible:
          - Roles Overview: reference/ansible/index.md
